services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: chm
      POSTGRES_PASSWORD: chm
      POSTGRES_DB: experiment
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chm -d experiment"]
      interval: 2s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://chm:chm@db:5432/experiment
      CONFIG_PATH: /app/config.yml
    volumes:
      - ./config.yml:/app/config.yml:ro
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: